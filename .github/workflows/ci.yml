name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check
  e2e-full-chromium:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      REQUIRE_WEBGL2: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-chromium
          path: test-results
  e2e-full-firefox:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps firefox
      - run: bun run test:e2e --project=firefox
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-firefox
          path: test-results
  e2e-full-webkit:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun x playwright install --with-deps webkit
      - run: bun run test:e2e --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-webkit
          path: test-results
